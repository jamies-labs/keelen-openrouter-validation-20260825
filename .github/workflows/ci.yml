name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: [self-hosted, linux, x64, keelen]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run ruff check .
  typecheck:
    runs-on: [self-hosted, linux, x64, keelen]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run mypy src
  test:
    runs-on: [self-hosted, linux, x64, keelen]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest -x
